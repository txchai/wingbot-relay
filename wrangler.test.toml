# Test-only Worker config used by vitest. Not deployable; contains no real values.
name = "wingbot"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "wingbot"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]

[vars]
REGISTRY_JSON = '''
{
  "version": 1,
  "bots": [
    {
      "id": "personal:wingbot",
      "webhook_url": "https://webhook.example.com/personal-wingbot",
      "webhook_key_secret": "WEBHOOK_KEY_PERSONAL_WINGBOT",
      "rate_limit_per_min": 30,
      "enabled": true
    },
    {
      "id": "work:wingbot",
      "webhook_url": "https://webhook.example.com/work-wingbot",
      "webhook_key_secret": "WEBHOOK_KEY_WORK_WINGBOT",
      "rate_limit_per_min": 30,
      "enabled": true
    }
  ],
  "pairs": [
    {
      "name": "personal-work",
      "bots": ["personal:wingbot", "work:wingbot"],
      "hmac_secret": "HMAC_PAIR_PERSONAL_WORK",
      "enabled": true
    }
  ]
}
'''
